<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dipasika — проекты</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
  :root{
    --bg:#080b18;
    --ink:#eef1ff;
    --muted:#a3aacd;
    --accent:#ffd166;
    --line:rgba(255,255,255,.12);
    --card:rgba(255,255,255,.05);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100dvh;
    padding:clamp(20px,5vw,64px);
    background:
      radial-gradient(1100px 780px at 12% -12%, #241b4d 0%, transparent 62%),
      radial-gradient(900px 700px at 96% 6%, #123048 0%, transparent 58%),
      radial-gradient(820px 620px at 52% 118%, #3b1634 0%, transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1000px;margin:0 auto}

  header{margin-bottom:clamp(24px,4vw,44px)}

  h1{
    margin:0 0 10px;
    font-size:clamp(28px,5vw,46px);
    line-height:1.1;
    letter-spacing:-.02em;
  }

  .lead{margin:0;color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:60ch}

  .count{
    display:inline-block;
    margin-top:16px;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--muted);
    font-size:13px;
  }

  .grid{
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }

  .card{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:18px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }

  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    border-color:rgba(255,209,102,.45);
    background:rgba(255,255,255,.08);
    outline:none;
  }

  .thumb{
    aspect-ratio:16/10;
    overflow:hidden;
    background:rgba(0,0,0,.3);
  }

  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}

  .body{padding:16px 18px 20px}

  .title{margin:0 0 6px;font-size:19px;font-weight:650;letter-spacing:-.01em}

  .desc{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}

  .path{
    margin-top:12px;
    font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size:12.5px;
    color:var(--accent);
    opacity:.9;
  }

  footer{
    margin-top:44px;
    padding-top:18px;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }

  code{
    font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size:12.5px;
    color:var(--ink);
  }

  .empty{
    padding:28px;
    border:1px dashed var(--line);
    border-radius:18px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>dipasika</h1>
    <p class="lead">Маленькие статические проекты. Каждый живёт в своей папке, собирать ничего не нужно — открывается прямо в браузере.</p>
    <span class="count" id="count"></span>
  </header>

  <main class="grid" id="grid" aria-label="Список проектов"></main>

  <footer>
    Новый проект = новая папка в корне + одна строка в массиве <code>PROJECTS</code> внутри этого файла.
    Подробнее — в <code>README.md</code>.
  </footer>
</div>

<script>
  // Один проект = одна папка в корне репозитория.
  const PROJECTS = [
    {
      dir: 'otkrytka-lera',
      title: 'Открытка для Леры',
      desc: 'Нейроптица ошибается, Лера — отличный менеджер. Статическая страница-открытка.',
      cover: 'otkrytka-lera/previews/preview-3-final.png'
    }
  ];

  const grid = document.getElementById('grid');
  const count = document.getElementById('count');

  count.textContent = PROJECTS.length === 1
    ? '1 проект'
    : PROJECTS.length + ' проекта';

  if (!PROJECTS.length) {
    grid.outerHTML = '<p class="empty">Пока пусто. Создай папку проекта и добавь его в список.</p>';
  } else {
    grid.innerHTML = PROJECTS.map(function (p) {
      const cover = p.cover
        ? '<div class="thumb"><img src="' + p.cover + '" alt="" loading="lazy"></div>'
        : '';
      return '<a class="card" href="' + p.dir + '/">' +
        cover +
        '<div class="body">' +
          '<h2 class="title">' + p.title + '</h2>' +
          '<p class="desc">' + p.desc + '</p>' +
          '<div class="path">' + p.dir + '/</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }
</script>
</body>
</html>
